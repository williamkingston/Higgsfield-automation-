<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>vyrn.</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    font-family: "Suisse Intl", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #000;
    -webkit-font-smoothing: antialiased;
  }

  #stage {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 1440px;
    height: 900px;
    background: #ffffff;
    overflow: hidden;
    transform-origin: bottom center;
    transform: translateX(-50%) scale(1);
  }

  .model {
    position: absolute;
    top: 0;
    left: 0;
    width: 1200px;
    height: 2980px;
    transform-origin: 0 0;
    will-change: transform;
    cursor: pointer;
  }

  .model-inner {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transition: opacity 0.45s ease;
    overflow: hidden;
  }

  .model video {
    position: absolute;
    top: 0;
    left: 50%;
    height: 109.29%;
    width: auto;
    transform: translate(-50%, -4%);
    transform-origin: top center;
    object-fit: cover;
  }

  .model .fallback-fill {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #EDE6E2;
  }

  /* Logo */
  #logo {
    position: fixed;
    left: 12px;
    top: 16px;
    width: 161.87px;
    height: 71px;
    z-index: 100000;
    transform-origin: top left;
    pointer-events: none;
  }
  #logo svg { width: 100%; height: 100%; display: block; }

  /* Bottom nav */
  #navbar {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    z-index: 100001;
  }
  .pill {
    background: rgba(0,0,0,0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 200px;
    height: 28px;
    display: flex;
    align-items: center;
    border: none;
    cursor: pointer;
  }
  .pill-icon {
    width: 28px;
    height: 28px;
    padding: 0;
    justify-content: center;
  }
  .pill-icon svg { width: 14px; height: 14px; }
  .pill-links {
    width: 600px;
    padding: 6px 24px;
    justify-content: space-between;
  }
  .pill-links a {
    text-decoration: none;
    color: #000;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Detail panels */
  .detail-panel {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100001;
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 600;
    color: #000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  .detail-panel.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  #panel-left {
    left: 24px;
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    text-align: left;
  }
  #panel-left .product-name { }
  #panel-left .product-desc {
    line-height: 1.45;
    font-weight: 600;
  }
  #panel-left .more-details {
    text-decoration: underline;
    cursor: default;
  }

  #panel-right {
    right: 24px;
    width: 154px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: right;
    align-items: flex-end;
  }
  #panel-right .wishlist {
    text-decoration: underline;
    cursor: default;
  }
  .size-row {
    display: flex;
    gap: 15px;
  }
  .size-row span.selected {
    text-decoration: underline;
  }
  .price {
    font-family: "Instrument Serif", "Didot", "Bodoni 72", "Times New Roman", Times, serif;
    font-variant-numeric: lining-nums;
    font-feature-settings: "lnum" 1, "onum" 0;
    font-size: 40px;
    letter-spacing: -0.8px;
    line-height: 1;
    text-transform: none;
  }
  .add-to-cart {
    width: 107px;
    height: 32px;
    border-radius: 23px;
    background: #000;
    color: #fff;
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 600;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    font-family: inherit;
  }

  @media (prefers-reduced-motion: reduce) {
    .model { transition: none !important; }
  }
</style>

<script>
(function () {
  "use strict";

  var NAT_W = 1200, NAT_H = 2980;
  var STAGE_W = 1440, STAGE_H = 900;

  var CX = [-96.5, -1.0, 108.5, 263, 460.5, 694, 1013, 1422.5, 1832];
  var BY = [506, 521, 554, 600, 662, 736, 831, 961, 1091];
  var SC = [0.034167, 0.046667, 0.0675, 0.098333, 0.139167, 0.188333, 0.251667, 0.339167, 0.4572];

  var PERIOD = 8, SLOT_MS = 3600;

  var PRODUCTS = [
    { name: "Sabbia Croc Set", desc: "Two-piece in croc-embossed leather — a sculpted long-sleeve top with a floor-grazing column skirt and matching boots.", price: "£2450" },
    { name: "Balloon-Sleeve Leather Top", desc: "Nappa leather top with dramatic leg-of-mutton sleeves, worn with second-skin leggings and opera gloves.", price: "£1890" },
    { name: "Dune Jersey Catsuit", desc: "Second-skin turtleneck catsuit in stretch jersey. Body-hugging silhouette with a hidden zip and extra-long sleeves.", price: "£1100" },
    { name: "Onyx Leather Playsuit", desc: "Long-sleeve leather playsuit with peaked shoulders and a nipped waist, shown over sheer tights.", price: "£1650" },
    { name: "Drape Halter Bodysuit", desc: "Halter bodysuit in fluid jersey with a gathered neckline, styled with leather opera gloves.", price: "£780" },
    { name: "Corset Leather Playsuit", desc: "Boned leather playsuit with a sweetheart bustier and fine straps. Finished with knee-high boots.", price: "£1290" },
    { name: "Cascade Fringe Gown", desc: "Floor-sweeping halter gown in liquid fringe. Bias-cut column silhouette that moves with every step.", price: "£3200" },
    { name: "Vapor Silk Slip", desc: "Bias-cut silk slip dress with a whisper-fine strap and a fluid, liquid drape.", price: "£960" }
  ];

  var VIDEO_EXT = /\.(mp4|mov|webm|m4v)$/i;
  var DISCOVERED_VIDEOS = []; // populated at build time if videos exist in project folder; none found here.

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var stage = document.getElementById("stage");
  var logo = document.getElementById("logo");
  var modelsContainer = document.getElementById("models");
  var panelLeft = document.getElementById("panel-left");
  var panelRight = document.getElementById("panel-right");
  var detailName = document.getElementById("detail-name");
  var detailDesc = document.getElementById("detail-desc");
  var detailPrice = document.getElementById("detail-price");

  var N = DISCOVERED_VIDEOS.length > 0 ? DISCOVERED_VIDEOS.length : 7;
  var SPACING = PERIOD / N;

  var models = [];
  var coverScale = 1;
  var prog = 0;
  var lastTime = null;
  var paused = false;
  var selectedIndex = null;
  var detailOpen = false;

  function lerp(a, b, t) { return a + (b - a) * t; }

  function place(model, q) {
    var i = Math.floor(q);
    if (i >= PERIOD) i = PERIOD - 1;
    if (i < 0) i = 0;
    var f = q - i;
    var s = lerp(SC[i], SC[i + 1], f);
    var cx = lerp(CX[i], CX[i + 1], f);
    var by = lerp(BY[i], BY[i + 1], f);
    var x = cx - (NAT_W * s) / 2;
    var y = by - (NAT_H * s);
    model.el.style.transform = "translate3d(" + x + "px," + y + "px,0) scale(" + s + ")";
    model.el.style.zIndex = String(Math.round(s * 10000));
  }

  function buildModels() {
    for (var i = 0; i < N; i++) {
      var el = document.createElement("div");
      el.className = "model";
      el.dataset.index = String(i);

      var inner = document.createElement("div");
      inner.className = "model-inner";

      var videoFile = DISCOVERED_VIDEOS[i];
      var mediaEl;
      if (videoFile) {
        mediaEl = document.createElement("video");
        mediaEl.muted = true;
        mediaEl.loop = true;
        mediaEl.autoplay = true;
        mediaEl.playsInline = true;
        mediaEl.preload = "auto";
        mediaEl.src = videoFile;
        mediaEl.addEventListener("error", function () {
          replaceWithFallback(this.closest(".model-inner"));
        });
      } else {
        mediaEl = document.createElement("div");
        mediaEl.className = "fallback-fill";
      }
      inner.appendChild(mediaEl);
      el.appendChild(inner);

      var product = PRODUCTS[i % PRODUCTS.length];

      var model = {
        el: el,
        inner: inner,
        media: mediaEl,
        isVideo: !!videoFile,
        index: i,
        product: product,
        slotOffset: i * SPACING
      };

      el.addEventListener("mouseenter", function (m) {
        return function () { onHoverStart(m); };
      }(model));
      el.addEventListener("mouseleave", function (m) {
        return function () { onHoverEnd(m); };
      }(model));
      el.addEventListener("click", function (m) {
        return function () { openDetail(m); };
      }(model));

      modelsContainer.appendChild(el);
      models.push(model);

      if (model.isVideo) {
        var dur = mediaEl.duration;
        mediaEl.addEventListener("loadedmetadata", function (m) {
          return function () {
            try { this.currentTime = (m.index / N) * this.duration; } catch (e) {}
          };
        }(model));
      }
    }
  }

  function replaceWithFallback(innerEl) {
    if (!innerEl || innerEl.querySelector(".fallback-fill")) return;
    innerEl.innerHTML = "";
    var fill = document.createElement("div");
    fill.className = "fallback-fill";
    innerEl.appendChild(fill);
  }

  function onHoverStart(model) {
    if (detailOpen) return;
    paused = true;
    models.forEach(function (m) {
      if (m === model) {
        m.inner.style.opacity = "1";
        if (m.isVideo && m.media.play) m.media.play();
      } else {
        m.inner.style.opacity = "0.7";
        if (m.isVideo && m.media.pause) m.media.pause();
      }
    });
  }

  function onHoverEnd() {
    if (detailOpen) return;
    paused = false;
    models.forEach(function (m) {
      m.inner.style.opacity = "1";
      if (m.isVideo && m.media.play) m.media.play();
    });
  }

  function computeCoverScale() {
    coverScale = Math.max(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    stage.style.transform = "translateX(-50%) scale(" + coverScale + ")";
    logo.style.transform = "scale(" + coverScale + ")";
    if (detailOpen && selectedIndex !== null) {
      applyDetailTransform(models[selectedIndex], false);
    }
  }

  function detailTransformValues(el) {
    var cs = coverScale, vw = window.innerWidth, vh = window.innerHeight;
    var s = (vh * 0.9) / (NAT_H * cs);
    var maxBoxW = vw - 2 * 300;
    if (NAT_W * s * cs > maxBoxW) s = maxBoxW / (NAT_W * cs);
    var mcy = 900 - vh / (2 * cs);
    var x = 720 - (NAT_W * s) / 2;
    var y = mcy - (NAT_H * s) / 2;
    return { x: x, y: y, s: s };
  }

  function applyDetailTransform(model, animate) {
    var t = detailTransformValues(model.el);
    if (!animate) {
      model.el.style.transition = "none";
    } else {
      model.el.style.transition = "transform 0.65s cubic-bezier(0.4, 0, 0.2, 1)";
    }
    model.el.style.transform = "translate3d(" + t.x + "px," + t.y + "px,0) scale(" + t.s + ")";
    model.el.style.zIndex = "99999";
    if (!animate) {
      void model.el.offsetHeight;
      model.el.style.transition = "";
    }
  }

  function openDetail(model) {
    if (detailOpen) return;
    detailOpen = true;
    paused = true;
    selectedIndex = model.index;

    models.forEach(function (m) {
      if (m === model) return;
      m.inner.style.opacity = "0";
      if (m.isVideo && m.media.pause) m.media.pause();
    });

    model.inner.style.opacity = "1";
    if (model.isVideo && model.media.play) model.media.play();

    applyDetailTransform(model, true);

    detailName.textContent = model.product.name;
    detailDesc.textContent = model.product.desc;
    detailPrice.textContent = model.product.price;

    panelLeft.classList.add("visible");
    panelRight.classList.add("visible");

    history.pushState({ detail: true, index: model.index }, "");
  }

  function closeDetail() {
    if (!detailOpen) return;
    detailOpen = false;

    var model = models[selectedIndex];
    if (model) {
      model.el.style.transition = "";
      place(model, (model.slotOffset + prog) % PERIOD);
    }

    models.forEach(function (m) {
      m.inner.style.opacity = "1";
      if (m.isVideo && m.media.play) m.media.play();
    });

    panelLeft.classList.remove("visible");
    panelRight.classList.remove("visible");

    selectedIndex = null;
    paused = false;
  }

  window.addEventListener("popstate", function () {
    if (detailOpen) closeDetail();
  });

  window.addEventListener("resize", computeCoverScale);

  function frame(now) {
    if (lastTime === null) lastTime = now;
    var dt = now - lastTime;
    lastTime = now;
    if (!paused && !reduceMotion) {
      prog = (prog + dt / SLOT_MS) % PERIOD;
      for (var i = 0; i < models.length; i++) {
        if (detailOpen && i === selectedIndex) continue;
        place(models[i], (models[i].slotOffset + prog) % PERIOD);
      }
    }
    requestAnimationFrame(frame);
  }

  buildModels();
  computeCoverScale();

  if (reduceMotion) {
    models.forEach(function (m) {
      place(m, m.slotOffset % PERIOD);
    });
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>

</body>
</html>
